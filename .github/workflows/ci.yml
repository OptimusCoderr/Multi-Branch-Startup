name: CI

# Deliberately scoped to what its README/TEST.md already call "automated
# checks" — typecheck, lint, and a production build for the web app;
# typecheck and a Metro bundle export for the mobile app. No live
# Postgres service container and no end-to-end tests run here: those need
# real infra (a database, a Chromium install) and are documented instead
# as a manual step in TEST.md's "Manual walkthrough" — a natural next
# step once this pipeline earns its keep, not a silent gap.
on:
  push:
    branches: ["**"]
  pull_request:

# A newer push on the same branch cancels an in-flight run for it, so CI
# time isn't spent on commits nobody's waiting on anymore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    env:
      # next build's static routes (/sign-in, /sign-up, /reset-password)
      # import better-auth.ts transitively, and betterAuth() reads these
      # at module load — placeholder values only, never real secrets, the
      # same shape as .env.example. prisma generate itself needs no live
      # database connection, just a schema, so DATABASE_URL only has to
      # be a syntactically valid Postgres URL, not a reachable one.
      DATABASE_URL: "postgresql://user:password@localhost:5432/inventory_ci?schema=public"
      BETTER_AUTH_SECRET: "ci-placeholder-secret-not-used-anywhere-real"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_BETTER_AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      # build before typecheck, not the other way round: tsconfig.json
      # includes .next/types/**/*.ts, generated by `next build`/`next dev`
      # (Next's typed-routes feature — e.g. layout.tsx's `LayoutProps`
      # helper type comes from there). On a fresh checkout with no .next
      # yet, a standalone `tsc --noEmit` fails on those types before build
      # ever creates them — next build already type-checks internally, so
      # running the explicit typecheck step after it is a fast, clear
      # confirmation rather than a redundant first attempt that's
      # guaranteed to fail on a clean checkout.
      - run: npm run build
      - run: npm run typecheck

  mobile:
    name: Mobile (typecheck, bundle export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # Confirms Metro can actually resolve and bundle every import (native
      # modules included) into real Hermes bytecode for both platforms —
      # catches the large majority of real breakage short of an actual
      # device render. Output isn't needed past that, so it's discarded.
      - run: npx expo export --platform ios --platform android --output-dir /tmp/mobile-export
